<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.png"><title>APEX Training Lab | Admin</title>
<style>
:root{--bg:#08090b;--card:#111317;--line:#2b2e36;--text:#f6f7f8;--muted:#a7abb4;--accent:#39a9ff;--danger:#d95353}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#252a32,#08090b 48%);color:var(--text);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1180px;margin:auto;padding:25px 18px 50px}.brand{text-align:center;margin-bottom:22px}.brand img{width:125px;border-radius:14px}.brand p{color:var(--muted);margin:7px}.card{background:#111317f7;border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:0 18px 45px #0006}.login{max-width:480px;margin:70px auto}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:#191b20;color:#fff;font-size:15px}select option{background:#191b20;color:#fff}button{padding:12px 15px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:900;cursor:pointer}.actions{margin-top:12px}.danger{background:var(--danger)}.muted{color:var(--muted)}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.stat{border:1px solid var(--line);border-radius:12px;padding:12px 15px;background:#181a20}.stat b{display:block;font-size:22px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:15px}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:#b8bdc7;text-transform:uppercase;font-size:11px;letter-spacing:.6px}.ok{color:#76dfa4;font-weight:800}.booked{color:#ffcf6b;font-weight:800}@media(max-width:800px){.grid,.filters{grid-template-columns:1fr}table{display:block;overflow:auto;white-space:nowrap}}
</style></head><body><div class="wrap">
<div id="login" class="card login"><div class="brand"><img src="/assets/apex-logo.png" alt="APEX"><p>Διαχείριση ραντεβού</p></div><input id="pass" type="password" placeholder="Κωδικός διαχειριστή"><div class="actions"><button onclick="login()">ΣΥΝΔΕΣΗ</button></div><p id="loginMsg" class="muted"></p></div>
<div id="app" style="display:none"><div class="brand"><img src="/assets/apex-logo.png" alt="APEX"><p>APEX Training Lab · Admin</p></div>
<div class="card"><h2>Νέα διαθέσιμη ώρα</h2><div class="grid" style="margin-top:15px"><input id="newDate" type="date"><input id="newTime" type="time"><select id="newService"><option>Personal Training</option><option>Mini Group</option></select></div><div class="actions"><button onclick="addSlot()">ΠΡΟΣΘΗΚΗ ΩΡΑΣ</button></div><p id="msg" class="muted"></p></div>
<div class="card"><h2>Ώρες & ραντεβού</h2><div class="stats"><div class="stat">Σύνολο<b id="total">0</b></div><div class="stat">Διαθέσιμα<b id="free">0</b></div><div class="stat">Κλεισμένα<b id="used">0</b></div></div>
<div class="filters"><input id="filterDate" type="date"><select id="filterService"><option value="">Όλες οι υπηρεσίες</option><option>Personal Training</option><option>Mini Group</option></select><select id="filterStatus"><option value="">Όλες οι καταστάσεις</option><option value="free">Διαθέσιμα</option><option value="booked">Κλεισμένα</option></select></div><div id="list" class="muted">Φόρτωση…</div></div></div>
</div><script>
let password="",rows=[];
async function api(url,opt={}){opt.headers={...(opt.headers||{}),"x-admin-password":password,"Content-Type":"application/json"};const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"Σφάλμα");return d}
async function login(){password=$("pass").value;try{await api("/api/admin/slots");$("login").style.display="none";$("app").style.display="block";load()}catch(e){$("loginMsg").textContent=e.message}}
const $=id=>document.getElementById(id);
async function addSlot(){try{await api("/api/admin/slots",{method:"POST",body:JSON.stringify({date:$("newDate").value,time:$("newTime").value,service:$("newService").value})});$("msg").textContent="Η ώρα προστέθηκε.";load()}catch(e){$("msg").textContent=e.message}}
async function load(){rows=await api("/api/admin/slots");render()}
function render(){let r=rows.filter(x=>(!$("filterDate").value||x.date===$("filterDate").value)&&(!$("filterService").value||x.service===$("filterService").value)&&(!$("filterStatus").value||($("filterStatus").value==="booked")==!!x.booking_id));$("total").textContent=rows.length;$("free").textContent=rows.filter(x=>!x.booking_id).length;$("used").textContent=rows.filter(x=>x.booking_id).length;
let h="<table><tr><th>Ημερομηνία</th><th>Ώρα</th><th>Υπηρεσία</th><th>Κατάσταση</th><th>Πελάτης</th><th>Τηλέφωνο</th><th>Ενέργεια</th></tr>";r.forEach(x=>h+=`<tr><td>${x.date}</td><td>${x.time}</td><td>${x.service}</td><td class="${x.booking_id?"booked":"ok"}">${x.booking_id?"Κλεισμένο":"Διαθέσιμο"}</td><td>${x.name||"-"}</td><td>${x.phone||"-"}</td><td>${x.booking_id?`<button class="danger" onclick="cancel(${x.booking_id})">Ακύρωση</button>`:`<button class="danger" onclick="del(${x.id})">Διαγραφή</button>`}</td></tr>`);h+="</table>";$("list").innerHTML=h}
async function del(id){if(confirm("Να διαγραφεί η διαθέσιμη ώρα;")){await api("/api/admin/slots/"+id,{method:"DELETE"});load()}}
async function cancel(id){if(confirm("Να ακυρωθεί το ραντεβού;")){await api("/api/admin/bookings/"+id,{method:"DELETE"});load()}}
["filterDate","filterService","filterStatus"].forEach(id=>$(id).onchange=render);
</script></body></html>
